server:
  port: 9081


spring:
  application:
    name: invoice-service
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    password: ${DATASOURCE_PASSWORD}
    url: ${SPRING_DATASOURCE_URL}
    username: root
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: true
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  kafka:
    bootstrap-servers: ${KAFKA_HOST:localhost:9092}

eureka:
  client:
    service-url:
      defaultZone: ${SERVER_DISCOVERY:http://localhost:8761/eureka}

enable:
  kafka: ${ENABLE_KAFKA:false}

kafka:
  consumer:
    client-id: invoices
  max:
    poll:
      records: 1

topic-name: invoices

logging:
  level:
    org:
      hibernate:
        SQL: info
        type:
          descriptor:
            sql:
              BasicBinder: info
invoice:
  discount:
    percent: 10
  tax:
    percent: 13

product:
  service:
    name: inventory-service
    base-url: product/v1
    update-inventory-url: /products-stock

service:
  general:
    protocol: http://



