server:
  port: 9081

spring:
  application:
    name: invoice-service
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    password: ${DATASOURCE_PASSWORD}
    url: ${SPRING_DATASOURCE_URL}
    username: root
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: true
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  kafka:
    bootstrap-servers: ${KAFKA_HOST:localhost:9092}

eureka:
  client:
    service-url:
      defaultZone: ${SERVER_DISCOVERY:http://localhost:8761/eureka}

messaging:
  provider: ${MESSAGING_PROVIDER:kafka}
  kafka:
    client-id: ${KAFKA_CLIENT_ID:invoices-service}
    topic: ${KAFKA_TOPIC:invoices}
    group-id: ${KAFKA_GROUP_ID:invoices-service}
    max-poll-records: ${KAFKA_MAX_POLL_RECORDS:1}
  kinesis:
    stream-name: ${KINESIS_STREAM_NAME:invoices}
    region: ${KINESIS_REGION:us-east-1}
    endpoint-override: ${ENDPOINT_OVERRIDE:http://localhost:4566}
    async-native: ${KINESIS_ASYNC:false}

security:
  enabled: ${SECURITY_ENABLED:false}
  jwt:
    secret: ${JWT_SECRET}
    expiration: 300000
  public:
    url:

kafka:
  consumer:
    client-id: invoices
  max:
    poll:

logging:
  level:
    org:
      hibernate:
        SQL: info
        type:
          descriptor:
            sql:
              BasicBinder: info
invoice:
  discount:
    percent: 10
  tax:
    percent: 13

product:
  service:
    name: inventory-service
    base-url: product/v1
    update-inventory-url: /products-stock

service:
  general:
    protocol: http://



